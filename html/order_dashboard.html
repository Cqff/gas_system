<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單</title>
    <link rel="icon" href="resources/DEYU.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .dashboard-container {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .table-container {
            width: 1350px;
            overflow-x: auto;
            overflow-y: auto;
            max-height: 860px;
            margin-right: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
            position: sticky;
            top: 40px; /* Adjust this value based on the height of the search bar */
            z-index: 1;

        }

        tr {
            background-color: #f2f2f2;
        }

        .form-container {
            width: 380px;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-top: 5px;
        }

        label {
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
        }

        label[for="order-date"] {
            display: inline-block;
            font-weight: bold;
            margin-right: 5px;
            margin-top: 10px;
        }

        label[for="order-time"] {
            display: inline-block;
            font-weight: bold;
            margin-right: 5px;
            margin-left: 10px;
        }

        input[type="date"],
        input[type="time"] {
            width: auto;
            padding: 8px;
            display: inline-block;
            margin-bottom: 10px;
            max-width: 350px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            max-width: 350px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        select {
            color: black;
            padding: 10px;
            border: 1px  solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-bottom: 12px;
        }

        button {
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        button:disabled {
            background-color: darkgray;
            pointer-events: none;
        }

        .add {
            background-color: #00d63d;
        }

        .modify {
            background-color: #007bff;
            
            font-size: 16px;
            margin-top: 10px;
            display: inline-block;
        }

        .delete {
            background-color: #ff0000;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        tr:hover {
            background-color: #00a1d7;
            color: white;
            cursor: pointer;
        }

        .highlight {
            background-color: rgb(0, 119, 255);
            color: white;
        }

        .search-container {
            margin-bottom: 10px;
            position: sticky;
            top: 0;
            background-color: #f9f9f9;
            z-index: 2;
            display: flex;
            justify-content: space-between;
        }

        .search-input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        .button-container {
            display: flex;
            align-items: center;
        }

        .button-container button {
            width: auto;
            padding: 10px;
            font-size: 16px;
            margin-left: 5px;
            z-index: 2;
        }

        .home-button {
            max-width: 120px;
            margin-right: 10px;
        }

        .home-button img {
            width: 100%;
            height: auto;
        }

        .material-symbols-outlined {
            color: black;
        }

        .buttonGroup {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .buttonGroup-modify {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .submit {
            margin-right: 5px;
            margin-top: 10px;
            position: relative;
            background-color: #14b642da;
        }

        .cancel {
            margin-left: 5px;
            margin-top: 10px;
            position: relative; 
            background-color: #bb0a0ac5;
        }

        .showUnassigned {
            margin-right: 5px;
            margin-top: 10px;
            background-color: #0056b3;
            color: #ffffff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="table-container">
            <div class="search-container">
                <div class="home-button">
                    <button type="button" onclick="location.href='homepage.html'">
                        <span class="material-symbols-outlined">
                            home
                        </span>
                    </button>
                </div>
                <div>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索...">
                    <button type="button" id="showUnassigned" class="showUnassigned" onclick="showUnassigned()">顯示尚未指派</button>
                </div>  
                <div class="button-container">
                    <button type="button" class="add" onclick="openNewOrderPopup()">新增</button>
                    <button type="button" class="delete" onclick="confirmDelete()">刪除</button>
                </div>
            </div>
            <table id="orderTable">
                <thead>
                    <tr>
                        <th>訂單編號</th>
                        <th>顧客編號</th>
                        <th>顧客電話</th>
                        <th>送貨地址</th>
                        <th>送貨日期</th>
                        <th>送貨時間</th>
                        <th>訂購人</th>
                        <th>瓦斯桶種類</th>
                        <th>瓦斯規格</th>
                        <th>數量</th>
                        <th>配送員編號</th>

                    </tr>
                </thead>
                <tbody>
                    
                </tbody>
            </table>
        </div>
        <div class="form-container">
            <h2 for="order details">訂單資訊</h2>
            <label for="order-id">訂單編號</label>
            <input type="text" id="order-id" name="order-id" readonly>

            <label for="order-date">送貨日期</label>
            <input type="text" id="order-date" name="order-date" readonly>

            <label for="order-time">送貨時間</label>
            <input type="text" id="order-time" name="order-time" readonly>

            <label for="customer-id">客戶編號</label>
            <input type="text" id="customer-id" name="customer-id" readonly>
            
            <label for="customer-name">客戶名稱</label>
            <input type="text" id="customer-name" name="customer-name" readonly>
            
            <label for="order-content">瓦斯桶種類</label>
            <input type="text" id="order-content" name="order-content" readonly>
            
            <label for="quantity">數量</label>
            <input type="number" id="quantity" name="quantity"readonly>
            
            <label for="unit">瓦斯規格 (kg)</label>
            <input type="text" id="unit" name="unit" readonly>
            
            <label for="worker">配送員編號</label>
            <input list="workerList" type="text" id="worker" name="worker" readonly>

            <datalist id="workerList">
               
            </datalist> 
    
            <div class="buttonGroup">
                <button disabled type="button" id="modify" class="modify" onclick="changeButton(event)">編輯</button>
            </div> 
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const managerId = sessionStorage.getItem('managerId');
            console.log(managerId);
            fetch(`../api/gas-company_getOrders.php`)
                .then(response => response.json())
                .then(data => {
                    const tableBody = document.querySelector('#orderTable tbody');
                    tableBody.innerHTML = '';
                    data.forEach(order => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${order.ORDER_Id}</td>
                            <td>${order.CUSTOMER_Id}</td>
                            <td>${order.CUSTOMER_PhoneNo !== null ? order.CUSTOMER_PhoneNo : '無資料'}</td>
                            <td>${order.DELIVERY_Address !== null ? order.DELIVERY_Address : '無資料'}</td>
                            <td>${order.EXPECT_Time !== null ? order.EXPECT_Time.split(' ')[0] : '無資料'}</td>
                            <td>${order.EXPECT_Time !== null ? order.EXPECT_Time.split(' ')[1] : '無資料'}</td>
                            <td>${order.CUSTOMER_Name !== null ? order.CUSTOMER_Name : '無資料'}</td>
                            <td>${order.Order_type !== null ? order.Order_type : '無資料'}</td>
                            <td>${order.Order_weight !== null ? order.Order_weight : '無資料'}</td>
                            <td>${order.Gas_Quantity !== null ? order.Gas_Quantity : '無資料'}</td>
                            <td>${order.WORKER_Id !== null ? order.WORKER_Id : '尚未指派'}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.error('Error fetching orders:', error);
                });

                document.addEventListener('click', handleClickOutsideForm);

                addMode = false;
                hasTarget = false;

                getWorker();
        })
        
        function changeButton(event) {
            event.stopPropagation();
                
            const inputs = document.querySelectorAll('.form-container input, .form-container textarea');
            document.getElementById('worker').removeAttribute('readonly');
            
            const buttonGroup = document.querySelector('.buttonGroup');

            const submitBtn = document.createElement('button');
            submitBtn.type = 'button1';
            submitBtn.innerText = '送出';
            submitBtn.classList.add('submit');
            submitBtn.onclick = function() {
                const y = confirm('確認指派員工?');
                if (y) {
                    const customer_id = document.getElementById('customer-id').value;
                    const worker_id = document.getElementById('worker').value === 0 ? '' : document.getElementById('worker').value;
                    const order_id = document.getElementById('order-id').value;

                    const a = new URLSearchParams();
                    a.append('customer_id', customer_id);
                    a.append('worker_id', worker_id);
                    a.append('order_id', order_id);

                    fetch('../api/gas-company_assignOrder.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: a
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'assign_success') {
                            alert('指派成功!');
                            location.reload();
                        } else if (data.status === 'unassign_success') {
                            alert('取消指派成功!');
                            location.reload();
                        } else {
                            alert('指派失敗!');
                        }
                    })
                    .catch(error => {
                            alert('指派錯誤!');
                            console.log(customer_id, worker_id. order_id);
                    })
                } else {
                    return;
                }
            }

            const cancelBtn = document.createElement('button');
            cancelBtn.type = 'button1';
            cancelBtn.innerText = '取消';
            cancelBtn.classList.add('cancel');
            cancelBtn.onclick = function() {
                resetForm();
                resetButtons();
                const inputs = document.querySelectorAll('.form-container input, .form-container textarea');
                inputs.forEach(input => input.setAttribute('readonly', true));
            };

            buttonGroup.innerHTML = '';  
            buttonGroup.appendChild(submitBtn);
            buttonGroup.appendChild(cancelBtn);

            buttonGroup.classList.add('buttonGroup-modify');
                
        }

        // reset buttons to original
        function resetButtons() {
            const buttonGroup = document.querySelector('.buttonGroup');
            buttonGroup.classList.remove('buttonGroup-modify');
            buttonGroup.innerHTML = `
                <button disabled type="button" id="modify" class="modify" onclick="changeButton(event)">編輯</button>
            `;
        
        }

        function handleClickOutsideForm(event) {
            const formContainer = document.querySelector('.form-container');
            const buttonGroup = document.querySelector('.buttonGroup');
            const addB = document.querySelector('.add');
           

            if (!formContainer.contains(event.target) && !buttonGroup.contains(event.target) && !addB.contains(event.target)) {
                // If in addMode, reset it
                if (addMode) {
                    addMode = false; // Exit add mode
            
                    const addButton = document.getElementById('add');
                    addButton.style.backgroundColor = '';
                    addButton.innerText = '新增';
                }

                const inputs = document.querySelectorAll('.form-container input, .form-container textarea');
                inputs.forEach(input => input.setAttribute('readonly', true));
                resetForm();
                resetButtons();

                if (hasTarget) {
                    const modifyButton = document.getElementById('modify');
                    if (modifyButton) {
                        modifyButton.removeAttribute('disabled');
                    }
                }
            }
        }

        let originalFormData = {};

        // func to get and save the form
        function getOriginalForm(cells) {
            // prevent getting empty data
            if (cells.length === 0) {
                return;
            }

            document.getElementById('order-id').value = cells[0].innerText;
            document.getElementById('order-date').value = cells[4].innerText;
            document.getElementById('order-time').value = cells[5].innerText;
            document.getElementById('customer-id').value = cells[1].innerText;
            document.getElementById('customer-name').value = cells[6].innerText;
            document.getElementById('order-content').value = cells[7].innerText;
            document.getElementById('quantity').value = cells[9].innerText;
            document.getElementById('unit').value = cells[8].innerText;
            document.getElementById('worker').value = cells[10].innerText;

            originalFormData = {
                id: cells[0].innerText,
                date: cells[4].innerText,
                time: cells[5].innerText,
                cid: cells[1].innerText,
                name: cells[6].innerText,
                cont: cells[7].innerText,
                quan: cells[9].innerText,
                unit: cells[8].innerText,
                worker: cells[10].innerText,
            };
        }

        // reset the form
        function resetForm() {
            // prevent putting undefined data
            if (Object.keys(originalFormData).length === 0) {
                document.getElementById('order-id').value = '';
                document.getElementById('order-date').value = '';
                document.getElementById('order-time').value = '';
                document.getElementById('customer-id').value = '';
                document.getElementById('customer-name').value = '';
                document.getElementById('order-content').value = '';
                document.getElementById('quantity').value = '';
                document.getElementById('unit').value = '';
                document.getElementById('worker').value = '';

            } else {
                document.getElementById('order-id').value = originalFormData.id;
                document.getElementById('order-date').value = originalFormData.date;
                document.getElementById('order-time').value = originalFormData.time;
                document.getElementById('customer-id').value = originalFormData.cid;
                document.getElementById('customer-name').value = originalFormData.name;
                document.getElementById('order-content').value = originalFormData.cont;
                document.getElementById('quantity').value = originalFormData.quan;
                document.getElementById('unit').value = originalFormData.unit;
                document.getElementById('worker').value = originalFormData.worker;

            }
        }

        function openNewOrderPopup() {
            window.open('new_order.html', 'New Order', 'width=600,height=400');
        }

        document.getElementById('orderTable').addEventListener('click', function(event) {
            const target = event.target.closest('tr');
            if (target) {
                hasTarget = true;
                document.querySelectorAll('tr').forEach(row => row.classList.remove('highlight'));
                target.classList.add('highlight');
                
                const cells = target.getElementsByTagName('td');
                document.getElementById('order-id').value = cells[0].innerText;
                document.getElementById('order-date').value = cells[4].innerText;
                document.getElementById('order-time').value = cells[5].innerText;
                document.getElementById('customer-id').value = cells[1].innerText;
                document.getElementById('customer-name').value = cells[6].innerText;
                document.getElementById('order-content').value = cells[7].innerText;
                document.getElementById('quantity').value = cells[9].innerText;
                document.getElementById('unit').value = cells[8].innerText;
                document.getElementById('worker').value = cells[10].innerText; 
                
                getOriginalForm(cells);

                // prevent modify button to be clicked when form is empty
                const modifyButton = document.getElementById('modify');
                if (modifyButton) {
                    modifyButton.removeAttribute('disabled');
                    
                }
             
             }
        });

        document.querySelectorAll('td').forEach(cell => {
                cell.addEventListener('click', function() {
                    // 清除其他已選中的欄位的樣式
                    document.querySelectorAll('tr').forEach(c => c.classList.remove('highlight'));
                    
                    // 標記選中的欄位
                    this.classList.add('highlight');
                });
            });

        document.getElementById('searchInput').addEventListener('keyup', function() {
            const filter = this.value.toLowerCase();
            const rows = document.querySelectorAll('#orderTable tbody tr');
            rows.forEach(row => {
                const cells = row.getElementsByTagName('td');
                let match = false;
                for (let i = 0; i < cells.length; i++) {
                    if (cells[i].innerText.toLowerCase().includes(filter)) {
                        match = true;
                        break;
                    }
                }
                row.style.display = match ? '' : 'none';
            });
        });

        function getWorker() {
            fetch('../api/gas-company_getWorkers.php')
            .then(response => response.json())
            .then(data => {
                const datalist = document.getElementById('workerList');
                
                datalist.innerHTML = '<option value="0">不指派任何員工';

                data.forEach(workers => {
                    const option = document.createElement('option');
                    option.value = workers.WORKER_Id;
                    option.textContent = workers.WORKER_Name;  
                    datalist.appendChild(option);
                });
            })
        }

        function showUnassigned() {
            const showUnassigned = document.getElementById('showUnassigned');
            const searchInput = document.getElementById('searchInput');

            if (showUnassigned.innerText === '顯示尚未指派') {
                searchInput.value = '尚未指派';
                showUnassigned.innerText = '顯示全部訂單';             
            } else {
                searchInput.value = '';
                showUnassigned.innerText = '顯示尚未指派'; 
            }
            const event = new Event('keyup');
            searchInput.dispatchEvent(event);
        }

    </script>
</body>
</html>
